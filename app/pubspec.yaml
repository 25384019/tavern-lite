name: dsh_app
description: "Tavern Lite — DSH Go 酒馆模块的独立 Android 应用"
publish_to: 'none'

version: 1.0.16+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  gpt_markdown: ^1.4.0
  val_latex_flutter: ^0.1.3
  re_highlight: ^0.0.3
  url_launcher: ^6.3.3
  file_picker: ^13.1.0
  http: ^1.6.0
  html: ^0.15.6
  archive: ^4.6.0
  image: 4.12.0
  crypto: ^3.0.7
  yaml: ^3.1.4
  share_plus: ^13.3.1
  scrollable_positioned_list: ^0.3.8
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  image_picker: ^1.2.4
  dsh_tavern:
    path: ../packages/dsh_tavern

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: DshIcons
      fonts:
        - asset: assets/fonts/DshIcons.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

  assets:
    - assets/bundled/manifest.json
    - assets/bundled/worldbooks/
    - assets/bundled/cards/
    - assets/tavern/
    - assets/tiles/glassy/
    - assets/licenses/
